apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment-2
  namespace: application
  labels:
    app.kubernetes.io/name: api-deployment-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-deployment-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-deployment-2
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-pair
                    operator: In
                    values: ["api-2"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: api-deployment-2
              topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-deployment-2
      containers:
        - name: api
          # Replace with a client-approved private registry image before deployment.
          image: registry.example.invalid/client/api-deployment-2:REPLACE
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
